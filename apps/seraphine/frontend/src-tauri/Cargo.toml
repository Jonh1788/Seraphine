[package]
name = "seraphine-desktop"
version = "0.1.0"
description = "Seraphine — local-first personal assistant (desktop + mobile shell)"
authors = ["Jonathan"]
edition = "2021"
rust-version = "1.77.2"

# tauri-build builds the frontend artifacts and merges them into the
# binary; runs at compile time only.
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Core Tauri surface. `macos-private-api` is required here because the
# feature is referenced in tauri.conf.json; it's a no-op on iOS/Android.
# `tray-icon` is desktop-only so we only add it under the desktop cfg.
tauri = { version = "2", features = ["devtools", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# SDD 018 — HealthKit bridge uses chrono for date math in the mock
# generator; the real Swift bridge will handle its own dates server-side.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Native STT embedded in the app — whisper.cpp bindings with Metal
# acceleration on Apple Silicon. No Python runtime, no external
# backend, no network round-trip. Model files are downloaded on
# first use to ~/Library/Caches/seraphine/ so the shipped binary
# stays small.
whisper-rs = { version = "0.14", features = ["metal"] }
dirs = "5"

# Desktop-only dependencies — mic capture (cpal), clipboard (arboard),
# global shortcuts, tray. iOS has its own equivalents via UIKit and
# requires none of these crates.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
cpal = "0.15"
arboard = "3"

[lib]
name = "seraphine_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# This feature is used for production builds or when a dev server is not
# specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
