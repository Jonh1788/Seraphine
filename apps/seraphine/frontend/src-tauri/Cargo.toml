[package]
name = "seraphine-desktop"
version = "0.1.0"
description = "Seraphine — local-first personal assistant (desktop + mobile shell)"
authors = ["Jonathan"]
edition = "2021"
rust-version = "1.77.2"

# tauri-build builds the frontend artifacts and merges them into the
# binary; runs at compile time only.
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Core Tauri surface. `macos-private-api` is required here because the
# feature is referenced in tauri.conf.json; it's a no-op on iOS/Android.
# `tray-icon` is desktop-only so we only add it under the desktop cfg.
# WARN: devtools feature exposes Web Inspector in release builds. Acceptable
# for personal app; remove for any public release. TODO: gate behind cfg.
tauri = { version = "2", features = ["devtools", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# SDD 018 — HealthKit bridge uses chrono for date math in the mock
# generator; the real Swift bridge will handle its own dates server-side.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Native STT embedded in the app — whisper.cpp bindings with Metal
# acceleration on Apple Silicon. No Python runtime, no external
# backend, no network round-trip. Model files are downloaded on
# first use to ~/Library/Caches/seraphine/ so the shipped binary
# stays small.
whisper-rs = { version = "0.14", features = ["metal"] }
dirs = "5"
base64 = "0.22"
# CV Triage — zip a folder of PDFs in memory for upload to the Seraphine
# backend (see Task 15). Default features (bzip2, zstd, time) are disabled
# because we only need deflate.
zip = { version = "2", default-features = false, features = ["deflate"] }
# Maestro approval server — a minimal synchronous HTTP server that receives
# Claude Code's global `PreToolUse` http-hook POSTs and blocks each request
# until the human (or the static safe-tool rule) returns a permission
# decision. Synchronous = no async runtime; one worker thread per request.
tiny_http = "0.12"
# Relé HTTP para a casa — fala com aparelhos da LAN (EspMusic hoje;
# luzes/garagem/piscina depois). TLS fica desligado de propósito: o relé
# só fala http:// com hosts da allowlist, e sem TLS a árvore de
# dependências fica pequena.
reqwest = { version = "0.12", default-features = false, features = ["multipart", "json"] }

[dev-dependencies]
tempfile = "3"

# Desktop-only dependencies — mic capture (cpal for the legacy PTT path;
# VoiceProcessingIO for realtime with AEC), clipboard, shortcuts, tray.
# iOS has its own equivalents via UIKit and requires none of these crates.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
# WARN: see core `tauri` line above — `devtools` is also enabled here
# for desktop targets and ships in release builds. Tracked for cfg gating.
tauri = { version = "2", features = ["tray-icon", "devtools", "macos-private-api", "image-png"] }
tauri-plugin-global-shortcut = "2"
cpal = "0.15"
arboard = "3"

# macOS-only: raw CoreAudio FFI for the VoiceProcessingIO audio unit
# (Apple AEC + noise suppression + AGC). Used by the realtime voice
# path so Seraphine's TTS played through VPIO output is cancelled from
# the mic input before Whisper sees it. cpal is kept for the PTT path
# (push-to-talk doesn't need AEC since the user isn't hearing TTS
# simultaneously).
[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-sys = "0.2"

# iOS-only: objc2 for tweaking the WKWebView at runtime. Tauri's wry
# iOS shell binds the WebView to `safeAreaLayoutGuide`, so the WKWebView
# stops short of the home-indicator zone — the bottom-nav can never reach
# the physical screen edge. Setting `contentInsetAdjustmentBehavior`
# = `.never` extends the WebView through safe-area; CSS `env()` keeps
# returning the real inset for layout adjustments.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.5"

[lib]
name = "seraphine_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# This feature is used for production builds or when a dev server is not
# specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
