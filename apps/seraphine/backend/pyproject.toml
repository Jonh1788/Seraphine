[project]
name = "seraphine"
version = "0.1.0"
description = "Local-first personal assistant — backend orchestrator"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "chromadb>=0.5",
    "beautifulsoup4>=4.12",
    "truststore>=0.10",
    "mlx-whisper>=0.4.3",
    "cryptography>=43",
    "apscheduler>=3.10,<4",
    "sqlalchemy>=2.0",
    "pdfplumber>=0.10",
    "pywebpush>=2",
    "llm-adapters",
    "core-db",
    "mod-tasks",
    "mod-finance",
]

[tool.uv.sources]
llm-adapters = { workspace = true }
core-db = { workspace = true }
mod-tasks = { workspace = true }
mod-finance = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-bdd>=7",
    "anyio>=4",
    "ruff>=0.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-bdd>=7",
    "anyio>=4",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seraphine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
