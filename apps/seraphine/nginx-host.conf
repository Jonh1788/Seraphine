# Host nginx vhost snippet for sera.jonhdev.io.
#
# Install on the VPS:
#   sudo cp apps/seraphine/nginx-host.conf /etc/nginx/sites-available/seraphine
#   sudo ln -sf /etc/nginx/sites-available/seraphine /etc/nginx/sites-enabled/seraphine
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then issue certs (certbot auto-adds the HTTPS server block + HTTP-301):
#   sudo certbot --nginx -d sera.jonhdev.io

server {
    server_name sera.jonhdev.io;

    # WebSocket + SSE: disable buffering, raise timeouts so /ws/conversation
    # can stream for long turns without getting cut.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
    proxy_send_timeout 24h;

    # Attachment/image uploads up to 25 MB.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade headers — required for /ws/conversation.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen 80;
}
