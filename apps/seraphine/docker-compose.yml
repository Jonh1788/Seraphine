# Seraphine production stack — backend + cliproxy sidecar.
#
# TLS termination lives OUTSIDE this stack: the host's system nginx
# (+ certbot) proxies sera.jonhdev.io → 127.0.0.1:8002 → backend container.
# Frontend (Tauri desktop + iOS shell) is distributed as signed apps
# and reads this backend via the public hostname, so we don't build/ship
# the web frontend here.
#
# CLIProxyAPI roda como sidecar pra dar refresh automático do token
# Claude Max OAuth e mascarar headers como Claude Code CLI nativo
# (X-App: cli + User-Agent claude-cli). Sem ele, tokens expiram a cada
# ~5h e ninguém renova porque o container não tem o `claude` CLI rodando
# pra refresh background.
#
# Usage on the VPS:
#   cp .env.prod.example .env.prod   # then fill the secrets
#   docker compose up -d --build
#   docker exec -it seraphine-cliproxy-1 ./CLIProxyAPI --login claude
#   # siga a URL, autorize, cole o code de volta no terminal
#
# Build context points at the monorepo root so uv can see the whole
# workspace (packages/* + uv.lock).

name: seraphine

services:
  backend:
    build:
      context: ../..
      dockerfile: apps/seraphine/backend/Dockerfile
    image: seraphine-backend:latest
    restart: unless-stopped
    # Run as root so the keychain.py fallback can still read the
    # 0600-permissioned credentials file if SERAPHINE_LLM_BACKEND is
    # ever flipped back to claude_max. Container is network-isolated.
    user: "0:0"
    env_file:
      - path: .env.prod
        required: true
    environment:
      HOME: /root
      SERAPHINE_SQLITE_PATH: /data/seraphine.sqlite
      SERAPHINE_CHROMA_PATH: /data/chroma
      SERAPHINE_SKILLS_DIR: /data/skills
      SERAPHINE_GOOGLE_TOKEN_PATH: /data/google-token.json
      SERAPHINE_LLM_BACKEND: anthropic
      SERAPHINE_ANTHROPIC_BASE_URL: http://cliproxy:8317
      # SERAPHINE_ANTHROPIC_API_KEY vem do .env.prod (== a api-key do
      # cliproxy/config.yaml; o backend usa esse valor no header
      # x-api-key/Authorization contra o sidecar).
      SERAPHINE_STT_BACKEND: remote
      # Embeddings via Ollama sidecar (mesma network). Overrides
      # qualquer SERAPHINE_OLLAMA_BASE_URL do .env.prod — o default
      # `host.docker.internal` não resolve em Linux e deixava a
      # memory semântica silenciosamente morta.
      SERAPHINE_OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - seraphine-data:/data
      # Mantém credentials montadas (read-only) só pro fallback do
      # claude_max backend caso a gente reverta. O cliproxy não usa
      # esse arquivo — tem o auth-dir próprio dele.
      - /root/.claude/.credentials.json:/root/.claude/.credentials.json:ro
    depends_on:
      cliproxy:
        condition: service_started
      ollama:
        condition: service_started
    ports:
      - "127.0.0.1:8002:8000"
    networks:
      - seraphine-net

  cliproxy:
    build:
      context: ./cliproxy
      dockerfile: Dockerfile
    image: seraphine-cliproxy:latest
    restart: unless-stopped
    volumes:
      - ./cliproxy/config.yaml:/CLIProxyAPI/config.yaml:ro
      - cliproxy-auths:/root/.cli-proxy-api
      - ./cliproxy/logs:/CLIProxyAPI/logs
    expose:
      - "8317"
    networks:
      - seraphine-net

  # Ollama sidecar — serve só pra embeddings (nomic-embed-text, ~274MB,
  # CPU-only, ~50ms/text). No first start, o entrypoint inicia o server
  # em background, espera ficar up e puxa o modelo uma vez; próximos
  # boots são instantâneos. Usa um healthcheck que só fica "healthy"
  # depois que o pull termina, pra não botar backend pra rodar com
  # modelo faltando (embed retornaria 404).
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        SERVE_PID=$$!
        until ollama list >/dev/null 2>&1; do sleep 1; done
        if ! ollama list | grep -q nomic-embed-text; then
          echo "pulling nomic-embed-text..."
          ollama pull nomic-embed-text
        fi
        touch /tmp/ready
        wait $$SERVE_PID
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 10s
      timeout: 3s
      retries: 60
      start_period: 5s
    volumes:
      - ollama-data:/root/.ollama
    expose:
      - "11434"
    networks:
      - seraphine-net

  # WhatsApp bridge — Express API wrapping whatsapp-web.js. Auth session
  # lives in `./whatsapp-data/` (bind mount, gitignored) so it survives
  # rebuilds and can be seeded from the local machine without re-scanning
  # the QR code. Reached by the backend at http://whatsapp-bridge:3001
  # (set via SERAPHINE_WHATSAPP_BRIDGE_URL in .env.prod).
  whatsapp-bridge:
    build:
      context: ../../services/whatsapp-bridge
      dockerfile: Dockerfile
    image: seraphine-whatsapp-bridge:latest
    restart: unless-stopped
    environment:
      PORT: "3001"
      # Backend reachable by service name on the private network.
      WEBHOOK_URL: http://backend:8000/webhook/whatsapp
      TZ: America/Sao_Paulo
      LOG_LEVEL: info
    volumes:
      # Seeded from the dev machine with the already-authenticated
      # whatsapp-web.js session so no QR re-scan is needed on first boot.
      - ./whatsapp-data/auth:/app/.wwebjs_auth
      - ./whatsapp-data/cache:/app/.wwebjs_cache
    # /dev/shm default of 64 MB is too small for Chromium and causes
    # random "Target closed" errors under load.
    shm_size: "512m"
    expose:
      - "3001"
    networks:
      - seraphine-net

volumes:
  seraphine-data:
  cliproxy-auths:
  ollama-data:

networks:
  seraphine-net:
    driver: bridge
