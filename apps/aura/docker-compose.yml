# Aura production stack — backend (FastAPI/uv) + frontend (nginx).
#
# TLS termination lives OUTSIDE this stack: the host's system nginx
# (+ certbot) proxies app.minha-aura.com → 127.0.0.1:8080 → this
# compose's frontend container → backend container.
#
# See DEPLOY.md for the host nginx vhost snippet.
#
# Usage on the VPS:
#   cp .env.prod.example .env.prod   # then fill the secrets
#   docker compose up -d --build
#
# Build contexts point at the monorepo root so uv/pnpm can see the whole
# workspace (packages/* + pnpm-workspace.yaml + uv.lock).

name: aura

services:
  backend:
    build:
      context: ../..
      dockerfile: apps/aura/backend/Dockerfile
    image: aura-backend:latest
    restart: unless-stopped
    # Pinned hostname: the OAuth token Fernet key is derived from
    # socket.gethostname(); without this, every `compose up --build`
    # gives the container a fresh random hostname and decryption of
    # previously stored Google tokens fails — disconnecting every
    # user that had Google linked.
    hostname: aura-backend
    env_file:
      - path: .env.prod
        required: true
    environment:
      AURA_SQLITE_PATH: /data/aura.sqlite
    volumes:
      - aura-data:/data
    expose:
      - "8001"
    networks:
      - aura-net

  frontend:
    build:
      context: ../..
      dockerfile: apps/aura/frontend/Dockerfile
    image: aura-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    # Bind to localhost only — the host nginx is the public entry point.
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - aura-net

  evolution:
    # ARCHIVED 2026-05-09: Aura runs WhatsApp via the bridge container
    # below. Evolution + bridge attached to the same WhatsApp account
    # caused the bridge's WA Web session to enter a silent zombie state
    # (Chromium alive, no message delivery) within ~4 days — likely
    # WhatsApp anti-abuse reaction to two clients on one device.
    # Re-enable only by passing `--profile legacy-evolution`.
    profiles: ["legacy-evolution"]
    # homolog ships the freshest Baileys; the stable v2.x tags lag
    # behind WhatsApp's web protocol bumps and silently fail to
    # emit QR codes. CONFIG_SESSION_PHONE_VERSION pins a current
    # WhatsApp Web version to bypass Baileys' embedded default.
    image: atendai/evolution-api:homolog
    restart: unless-stopped
    hostname: aura-evolution
    env_file:
      - path: .env.prod
        required: true
    environment:
      # Evolution v2 dropped the SQLite provider — only postgres / mysql
      # accepted. Postgres sidecar below carries instance state.
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${AURA_EVOLUTION_DB_PASSWORD}@evolution-postgres:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution_exchange
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/0
      AUTHENTICATION_API_KEY: ${AURA_EVOLUTION_API_KEY}
      WEBHOOK_GLOBAL_URL: http://backend:8001/whatsapp/webhook
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_HEADERS: '{"X-Evolution-Webhook-Token":"${AURA_EVOLUTION_WEBHOOK_TOKEN}"}'
      # Per-event opt-ins for the GLOBAL webhook. v2 dropped support
      # for custom headers on per-instance webhooks, so we route via
      # global and enumerate which events get dispatched.
      WEBHOOK_EVENTS_QRCODE_UPDATED: "true"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      # Pin a recent WhatsApp Web protocol version so Baileys doesn't
      # fall back to its baked-in (stale) default. Bump if WhatsApp
      # rotates and the QR stops emitting.
      CONFIG_SESSION_PHONE_VERSION: 2.3000.1029432075
      CONFIG_SESSION_PHONE_NAME: Chrome
      CONFIG_SESSION_PHONE_CLIENT: Aura
      # INFO during the bring-up; can be downgraded to WARN once the
      # number is paired and traffic settles.
      LOG_LEVEL: INFO
    volumes:
      - evolution-data:/evolution/instances
    networks:
      - aura-net
    expose:
      - "8080"
    depends_on:
      - evolution-redis
      - evolution-postgres
      - backend

  evolution-postgres:
    profiles: ["legacy-evolution"]
    image: postgres:16-alpine
    restart: unless-stopped
    hostname: aura-evolution-postgres
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${AURA_EVOLUTION_DB_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - evolution-postgres-data:/var/lib/postgresql/data
    networks:
      - aura-net
    expose:
      - "5432"

  evolution-redis:
    profiles: ["legacy-evolution"]
    image: redis:7-alpine
    restart: unless-stopped
    hostname: aura-evolution-redis
    volumes:
      - evolution-redis-data:/data
    networks:
      - aura-net
    expose:
      - "6379"

  # whatsapp-web.js bridge — the canonical WhatsApp transport for Aura
  # (Evolution archived behind `legacy-evolution` profile). Same image
  # as Seraphine's bridge, separate volume so the two stacks have
  # independent sessions.
  # IMPORTANT: service name MUST differ from seraphine's "whatsapp-bridge"
  # because docker-compose registers the service name as a DNS alias on
  # every connected network — having the same name on the shared
  # seraphine-net causes DNS round-robin between the two bridges.
  aura-whatsapp-bridge:
    build:
      context: ../../services/whatsapp-bridge
      dockerfile: Dockerfile
    image: aura-whatsapp-bridge:latest
    # Pinned container name (the implicit `aura-aura-whatsapp-bridge-1`
    # would otherwise leak the doubled project prefix).
    container_name: aura-whatsapp-bridge-1
    restart: unless-stopped
    hostname: aura-whatsapp-bridge
    environment:
      PORT: "3001"
      WEBHOOK_URL: http://backend:8001/whatsapp/webhook
      TZ: America/Sao_Paulo
      LOG_LEVEL: info
    volumes:
      - aura-whatsapp-data:/app/.wwebjs_auth
      - aura-whatsapp-cache:/app/.wwebjs_cache
    shm_size: "512m"
    # /api/status reflects the actual WhatsApp Web session state
    # ("ready" only when paired and connected). Plain HTTP-server
    # liveness wouldn't catch the zombie-session bug we hit. Restart
    # is driven by the in-process heartbeat in src/client.ts that
    # `process.exit(1)`s on N consecutive non-CONNECTED reads — this
    # healthcheck is the external observability mirror.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/status | grep -q '\"status\":\"ready\"' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      # aura-net: reachable by aura backend as `aura-whatsapp-bridge`.
      # seraphine-net: same name → unified Manager UI on the seraphine
      # backend (sera.jonhdev.io/wa) reaches it without a host hop.
      - aura-net
      - seraphine-net
    expose:
      - "3001"

volumes:
  aura-data:
  evolution-data:
  evolution-postgres-data:
  evolution-redis-data:
  aura-whatsapp-data:
  aura-whatsapp-cache:

networks:
  aura-net:
    driver: bridge
  # External network created by the seraphine compose stack. Used so
  # the unified WhatsApp Manager UI (seraphine backend) can reach
  # aura-whatsapp-bridge directly without a host-port hop.
  seraphine-net:
    external: true
    name: seraphine_seraphine-net
