# Aura production stack — backend (FastAPI/uv) + frontend (nginx).
#
# TLS termination lives OUTSIDE this stack: the host's system nginx
# (+ certbot) proxies app.minha-aura.com → 127.0.0.1:8080 → this
# compose's frontend container → backend container.
#
# See DEPLOY.md for the host nginx vhost snippet.
#
# Usage on the VPS:
#   cp .env.prod.example .env.prod   # then fill the secrets
#   docker compose up -d --build
#
# Build contexts point at the monorepo root so uv/pnpm can see the whole
# workspace (packages/* + pnpm-workspace.yaml + uv.lock).

name: aura

services:
  backend:
    build:
      context: ../..
      dockerfile: apps/aura/backend/Dockerfile
    image: aura-backend:latest
    restart: unless-stopped
    # Pinned hostname: the OAuth token Fernet key is derived from
    # socket.gethostname(); without this, every `compose up --build`
    # gives the container a fresh random hostname and decryption of
    # previously stored Google tokens fails — disconnecting every
    # user that had Google linked.
    hostname: aura-backend
    env_file:
      - path: .env.prod
        required: true
    environment:
      AURA_SQLITE_PATH: /data/aura.sqlite
    volumes:
      - aura-data:/data
    expose:
      - "8001"
    networks:
      - aura-net

  frontend:
    build:
      context: ../..
      dockerfile: apps/aura/frontend/Dockerfile
    image: aura-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    # Bind to localhost only — the host nginx is the public entry point.
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - aura-net

  evolution:
    image: atendai/evolution-api:v2.1.0
    restart: unless-stopped
    hostname: aura-evolution
    env_file:
      - path: .env.prod
        required: true
    environment:
      DATABASE_PROVIDER: sqlite
      DATABASE_CONNECTION_URI: file:/evolution/instances/evolution.db
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/0
      AUTHENTICATION_API_KEY: ${AURA_EVOLUTION_API_KEY}
      WEBHOOK_GLOBAL_URL: http://backend:8001/whatsapp/webhook
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_HEADERS: '{"X-Evolution-Webhook-Token":"${AURA_EVOLUTION_WEBHOOK_TOKEN}"}'
      LOG_LEVEL: WARN
    volumes:
      - evolution-data:/evolution/instances
    networks:
      - aura-net
    expose:
      - "8080"
    depends_on:
      - evolution-redis
      - backend

  evolution-redis:
    image: redis:7-alpine
    restart: unless-stopped
    hostname: aura-evolution-redis
    volumes:
      - evolution-redis-data:/data
    networks:
      - aura-net
    expose:
      - "6379"

volumes:
  aura-data:
  evolution-data:
  evolution-redis-data:

networks:
  aura-net:
    driver: bridge
