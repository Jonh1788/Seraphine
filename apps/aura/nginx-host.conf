# Host nginx vhost snippet for app.minha-aura.com.
#
# Install on the VPS:
#   sudo cp apps/aura/nginx-host.conf /etc/nginx/sites-available/aura
#   sudo ln -sf /etc/nginx/sites-available/aura /etc/nginx/sites-enabled/aura
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then issue certs (certbot auto-adds the HTTPS server block + HTTP-301):
#   sudo certbot --nginx -d app.minha-aura.com -d minha-aura.com

server {
    listen 80;
    server_name app.minha-aura.com;

    # Chat uses SSE — disable buffering, raise timeouts.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
    proxy_send_timeout 24h;

    # Note / PDF / image uploads up to 20MB.
    client_max_body_size 20m;

    # Alexa skill endpoint — Alexa caps the response at ~8s, so a stuck
    # handler must not park the Echo conversation. Override the
    # SSE-friendly long read timeout to a tight 10s window. The explicit
    # Signature-* header forwarding is belt-and-suspenders; nginx
    # forwards client headers by default, but stating intent here
    # documents that those headers must reach the backend untouched.
    location /alexa {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Signature-256 $http_signature_256;
        proxy_set_header SignatureCertChainUrl $http_signaturecertchainurl;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Apex → app.
server {
    listen 80;
    server_name minha-aura.com www.minha-aura.com;
    return 301 https://app.minha-aura.com$request_uri;
}
