[project]
name = "aura"
version = "0.1.0"
description = "Aura — multi-tenant personal assistant SaaS (backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "core-db",
    "core-auth",
    "llm-adapters",
    "mod-tasks",
    "mod-finance",
    "google-integration",
    "mod-vision",
    "faster-whisper>=1.0",
]

[tool.uv.sources]
core-db = { workspace = true }
core-auth = { workspace = true }
llm-adapters = { workspace = true }
mod-tasks = { workspace = true }
mod-finance = { workspace = true }
google-integration = { workspace = true }
mod-vision = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "anyio>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aura"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
