# Aura frontend — serves the built SPA and proxies API routes to the
# backend container. Caddy sits in front of this on host :80/:443 and
# routes app.minha-aura.com → this service on the internal network.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Shave a few bytes off responses.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/xml+rss image/svg+xml;
    gzip_min_length 1024;

    # --- API proxy -------------------------------------------------------
    # Every router mounted by aura/main.py:
    #   /auth  /chat  /tasks  /finance  /google  /recurring  /briefing
    #   /habits  /knowledge  /projects  /goals  /push  /whatsapp  /health
    #
    # `/alexa` is handled by its own ``location ^~`` block below (higher
    # precedence than this regex) so it can carry a tighter 10s
    # proxy_read_timeout for Alexa's 8s response budget.
    #
    # `backend` resolves via the compose network.
    location ~ ^/(auth|chat|tasks|finance|google|recurring|briefing|habits|knowledge|projects|goals|push|whatsapp|health)(/|$) {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Chat SSE streaming — no buffering, no timeout.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;

        # Multipart uploads (nota fiscal PDF/image up to 10MB).
        client_max_body_size 20m;
    }

    # Alexa skill endpoint — Alexa caps the response at ~8s, so a stuck
    # backend handler must not park the Echo conversation. Override the
    # SSE-friendly long read timeout to a tight 10s window for /alexa
    # routes only. This block must come AFTER the regex above so the
    # regex still matches first; nginx evaluates exact > prefix > regex,
    # and within prefixes uses longest-match.
    location ^~ /alexa {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Signature-256 $http_signature_256;
        proxy_set_header SignatureCertChainUrl $http_signaturecertchainurl;
        proxy_read_timeout 10s;
    }

    # --- Static SPA ------------------------------------------------------
    # Hashed Vite assets under /assets/ are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else → index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
