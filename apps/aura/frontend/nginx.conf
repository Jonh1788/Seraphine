# Aura frontend — serves the built SPA and proxies API routes to the
# backend container. Caddy sits in front of this on host :80/:443 and
# routes app.minha-aura.com → this service on the internal network.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Shave a few bytes off responses.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/xml+rss image/svg+xml;
    gzip_min_length 1024;

    # --- API proxy -------------------------------------------------------
    # Every router mounted by aura/main.py:
    #   /auth  /chat  /tasks  /finance  /google  /recurring  /briefing
    #   /habits  /knowledge  /projects  /goals  /push  /whatsapp  /health
    #
    # `backend` resolves via the compose network.
    location ~ ^/(auth|chat|tasks|finance|google|recurring|briefing|habits|knowledge|projects|goals|push|whatsapp|health)(/|$) {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Chat SSE streaming — no buffering, no timeout.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;

        # Multipart uploads (nota fiscal PDF/image up to 10MB).
        client_max_body_size 20m;
    }

    # --- Evolution Manager UI (admin) ------------------------------------
    # Native Evolution v2 UI for instance/QR management. Lives under
    # /manager. Useful as a fallback when the QR webhook delivery is
    # flaky. The UI prompts for the AURA_EVOLUTION_API_KEY at login.
    location /manager {
        proxy_pass http://evolution:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
    # Manager UI's API client also hits these top-level Evolution paths
    # for instance metadata and live status. Proxy them too. NOTE we
    # exclude /chat (collides with Aura's chat router) and /messages
    # (same conflict via /chat/.../messages); the manager UI doesn't
    # need those for the QR/pair flow.
    location ~ ^/(instance|webhook|settings|message|group)/ {
        proxy_pass http://evolution:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
    # Server-URL prefix for the Manager UI login: strip the prefix and
    # forward to Evolution's root so the welcome-JSON probe succeeds.
    # Login with Server URL = https://app.minha-aura.com/manager-api
    location /manager-api/ {
        proxy_pass http://evolution:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # --- Static SPA ------------------------------------------------------
    # Hashed Vite assets under /assets/ are safe to cache forever.
    # Fall back to the Evolution Manager UI's asset bundle on miss
    # (its HTML hardcodes /assets/index-*.js, same prefix as Vite).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri @evolution_assets;
    }
    location @evolution_assets {
        proxy_pass http://evolution:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Everything else → index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
