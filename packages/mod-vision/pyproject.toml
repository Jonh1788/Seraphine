[project]
name = "mod-vision"
version = "0.1.0"
description = "PDF + image understanding via LLMClient (receipts, bank statements, photos)"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.10",
    "llm-adapters",
]

[tool.uv.sources]
llm-adapters = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mod_vision"]
