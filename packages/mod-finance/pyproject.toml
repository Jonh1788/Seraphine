[project]
name = "mod-finance"
version = "0.1.0"
description = "Financial entries, recurring rules, monthly summaries + PDF import flow"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.8",
    "core-db",
    "mod-tasks",
]

[tool.uv.sources]
core-db = { workspace = true }
mod-tasks = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mod_finance"]
