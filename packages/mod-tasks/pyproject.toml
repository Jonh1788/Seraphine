[project]
name = "mod-tasks"
version = "0.1.0"
description = "Seraphine/Aura internal task system — CRUD + email scanner + execute dispatch"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.8",
    "core-db",
    "llm-adapters",
]

[tool.uv.sources]
core-db = { workspace = true }
llm-adapters = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mod_tasks"]
