[project]
name = "google-integration"
version = "0.1.0"
description = "Google OAuth + Gmail + Calendar client + pluggable TokenStore (file vs DB)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.8",
    "cryptography>=43",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/google_integration"]
