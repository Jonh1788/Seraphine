[project]
name = "core-auth"
version = "0.1.0"
description = "User + JWT + FastAPI require_user dep; shared auth between Seraphine (single-user) and Aura (multi-tenant)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "argon2-cffi>=23",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core_auth"]
